[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dollcrew-aligndrift"
version = "0.1.0"
description = "追踪对齐指标随版本的变化，标出退化的方向与幅度"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "dollcrew" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://dollcrew.github.io"
Repository = "https://github.com/dollcrew/aligndrift"
Issues = "https://github.com/dollcrew/aligndrift/issues"

[project.scripts]
aligndrift = "aligndrift:main"

[tool.setuptools]
py-modules = ["aligndrift"]
